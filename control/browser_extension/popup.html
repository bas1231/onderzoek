<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Prediction Research Bridge</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      width: 370px;
      padding: 14px;
    }

    h3 {
      margin-top: 0;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      margin: 6px 0 10px 0;
    }

    button {
      width: 100%;
      margin-top: 7px;
      padding: 8px;
    }

    #status {
      white-space: pre-wrap;
      margin-top: 12px;
      font-size: 12px;
      max-height: 320px;
      overflow: auto;
    }

    .primary {
      font-weight: 700;
    }

    .test {
      font-weight: 700;
      margin-top: 15px;
    }

    .small {
      font-size: 11px;
      opacity: 0.75;
    }
  </style>
</head>
<body>

<h3>Prediction Research Bridge</h3>

<label for="token">Local bridge token</label>
<input id="token" type="password" autocomplete="off">

<button id="save">Save token</button>

<button id="armProject" class="primary">
  Always arm chats in this project
</button>

<button id="armChat">
  Arm only this chat
</button>

<button id="roundTrip" class="test">
  Run local round-trip test
</button>

<button id="health">
  Check local bridge
</button>

<button id="disableProject">
  Disable project auto-arm
</button>

<button id="disarm">
  Disarm everything
</button>

<div id="status"></div>

<p class="small">
Round-trip test bypasses ChatGPT page scanning and directly tests:
extension → bridge → Git → WSL → result.
</p>

<script src="popup.js"></script>

</body>
</html>
