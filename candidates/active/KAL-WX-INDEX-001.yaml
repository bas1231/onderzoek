schema_version: 3
candidate:
  id: KAL-WX-INDEX-001
  venue: kalshi
  mechanism_id: MECH-WEATHER-INFORMATION-LAG-001
  family: weather_hourly_temperature
  search_family: hourly_weather_information_lag
  title: "Weather Index innovations predict KXTEMP settlement and repricing"
  status: PREBUILD_CANDIDATE
  economic_status: NO_PROVEN_EDGE
  created_at: 2026-09-19
  updated_at: 2026-09-21

  thesis: >-
    Publicly observable Kalshi Weather Index state, station composition and calibration state may improve short-horizon prediction of the exact hourly KXTEMP settlement value and may not always be fully reflected in contemporaneous executable market prices.

  build_warrant:
    evidence_capture: BUILD_APPROVED
    strategy_model_execution: BUILD_BLOCKED
    assessment: experiments/prebuild/KAL-WX-PB001-weather-index-build-warrant.yaml
    reason: >-
      Point-in-time capture has high information value and low incremental engineering cost, but direct rules proof,
      economic headroom and execution reality still require synchronized market evidence.

  multiple_testing_context:
    initial_cities: 4
    preregistered_horizons: 7
    feature_families: 17
    independence_unit: "city x local_date x hourly settlement; threshold contracts from one settlement are correlated"
    rule: "Count inspected city/horizon/feature subgroup searches. Post-hoc survivors require a new experiment version and fresh confirmation data."

  scope:
    horizons_minutes: [240, 180, 120, 60, 30, 15, 5]
    market_family: KXTEMP
    initial_cities:
      - miami
      - new_york_city
      - chicago
      - los_angeles
    note: "Cities are starting strata, not guaranteed final scope; every city requires exact contract-specific rule/source proof."

  source_migration_context:
    status: OBSERVED_BUT_NOT_EDGE
    finding: >-
      Chicago has a documented 2026-09-10 intra-day cutover from an older TWC-referenced series at 10:00 EDT
      to a newer Synoptic Data / Kalshi Weather Index Methodology series at 11:00 EDT.
    negative_evidence:
      - "Exact same-city x same-settlement-minute old/new overlap is UNPROVEN."
      - "Adjacent-hour source cutover is not a deterministic cross-source arbitrage pair."
      - "Public builders already monitor newer KWI/Synoptic semantics, so novelty cannot rely on others using the wrong source."
    agent_rule: "Never infer source from ticker/title or generic help material; contemporaneous contract-specific rules control."

  external_corroboration:
    as_of: 2026-09-21
    status: BROAD_SIGNAL_CORROBORATED_NOVELTY_REDUCED
    evidence_note: knowledge/kalshi/KALSHI_KWI_EXTERNAL_CORROBORATION_2026-09-21.md
    findings:
      - >-
        Wethr.net publicly documents a beta Hourly Index API that recomputes Kalshi Weather Index from a faster observation feed and says estimates are usually available 2-3 minutes before Kalshi publication.
      - >-
        Wethr publishes very strong estimate-vs-official accuracy summaries, but its documentation defines those aggregates using the final estimate as of the t+5 publication deadline; do not treat those figures as proof of accuracy at first early signal time.
      - >-
        Community tooling on Apify archives KWI minute data, station observations, calibration/status fields including incomplete states, and explicitly targets KXTEMP backtesting; basic KWI collection is therefore not novel.
      - >-
        Synoptic documents one-minute HF-ASOS as normally arriving with 2-5 minutes latency and classifies the feed as experimental, supporting the few-minute timing scale while adding outage/regime risk.
    novelty_implication: >-
      The broad claim 'predict KWI a few minutes before canonical publication' is externally corroborated and competitive. Any remaining novelty claim must be narrower, such as the exact first-decision-eligible full-station incomplete-point mechanism, and must not be assumed novel without a fresh search.
    economic_implication: >-
      External corroboration raises confidence in the signal phenomenon but also raises the prior that other participants already consume similar information. The decisive test is synchronized market-reaction latency and executable depth, not further proof that KWI is reconstructible.
    mandatory_next_test: >-
      At the first decision-eligible internal signal timestamp, prove whether contemporaneous executable KXTEMP L2 still offers stale price and sufficient depth after realistic signal-to-order latency, fees, partial fills and adverse selection.

  gates:
    prebuild_novelty:
      status: PARTIAL_PASS_NARROW_ONLY
      requirement: "Narrow incomplete/full-station information-timing mechanism only; broad early-KWI reconstruction is externally known and cannot support novelty."
    source_semantics:
      status: PENDING_DIRECT_RULE_CAPTURE
      requirement: "Exact active series/event/market rules and source must be archived point-in-time."
    cheap_empirical:
      status: READY_NOT_RUN
      requirement: "Use known public Weather Index/orderbook corpus for development-only sanity replay; never as untouched holdout."
    economic_headroom:
      status: UNPROVEN
      requirement: "Establish plausible forecast surplus versus executable market large enough to survive unavoidable friction before strategy engineering."
    execution_spotcheck:
      status: READY_NEEDS_CONTINUOUS_WS
      requirement: "Use same-time executable L2/fees/trades from the first decision-eligible signal timestamp; continuous WebSocket evidence required for second-level repricing claims."
    signal_edge:
      status: RESEARCH_POSITIVE_E390_PENDING_REDTEAM
      requirement: "Preserve E390 prospective result, complete unchanged red-team/falsification gates, and do not infer market edge from signal accuracy alone."
    market_edge:
      status: UNTESTED_CRITICAL_NEXT_GATE
      requirement: "Model probabilities must improve on contemporaneous executable market probabilities after fees/spread/depth and realistic signal-to-order latency."
    execution:
      status: UNTESTED
      requirement: "Prospective shadow and later separately authorized micro-live survive fill, latency and slippage constraints."

  three_angle_plan:
    angle_1_rules_semantics:
      objective: "Prove exact settlement source, rule transformation, thresholds, timing, rounding, data eligibility and calibration version for each tested event."
      failure_mode: "Wrong source/rule/version makes all later backtests invalid."
    angle_2_signal_replay:
      objective: "Point-in-time replay Weather Index + detailed stations + calibrations against final settlement; compare strong baselines."
      failure_mode: "Index adds no stable out-of-sample predictive information."
    angle_3_market_execution:
      objective: "Join the first decision-eligible predictions to same-time executable L2 and measure incremental Brier/log-loss plus realizable net EV and edge decay after signal receipt."
      failure_mode: "Market already incorporates signal, external competitors reprice first, or execution frictions consume it."
      evidence_requirement: "Continuous orderbook_delta/trade stream before any second-level repricing-lag conclusion."
    optional_angle_4_adversarial:
      objective: "Independent implementation plus source/config/revision/competition counterexample search."

  baselines:
    - persistence_last_index
    - linear_trend_15m
    - linear_trend_30m
    - station_weighted_current_state
    - nearest_primary_station
    - market_implied_probability

  candidate_features:
    - index_level
    - index_trend_5m
    - index_trend_15m
    - index_trend_30m
    - index_acceleration
    - contributor_count
    - status
    - receipt_basis
    - station_dispersion
    - max_station_age_ms
    - min_station_age_ms
    - weighted_station_residuals
    - config_version
    - days_since_calibration
    - calibration_offset_vector
    - calibration_change_flag
    - local_hour
    - solar_time_proxy
    - threshold_distance

  required_point_in_time_data:
    - exact_market_rules_and_rules_version
    - series_event_market_metadata
    - weather_index_minutes
    - detailed_station_breakdown
    - calibration_timeline_with_published_at
    - first_decision_eligible_signal_timestamp
    - kxtemp_l2_orderbook
    - websocket_orderbook_sequence
    - trades
    - market_lifecycle
    - final_settlement
    - fee_schedule

  primary_metrics:
    continuous:
      - MAE
      - CRPS
    probability:
      - Brier_score
      - log_loss
      - calibration
      - sharpness
    economic:
      - net_expected_value_per_contract
      - realized_shadow_fill_bound
      - return_on_capital_time
      - edge_decay_from_first_signal

  splits:
    method: temporal_grouped
    grouping: "city x local_date"
    sequence:
      - development
      - validation
      - untouched_holdout
      - prospective_shadow

  preregistered_kill_rules:
    - "Kill signal lane if index-enhanced model does not beat predeclared baselines on untouched holdout with stable sign across meaningful city/horizon strata."
    - "Kill market-edge lane if predictive improvement does not beat executable market probability after fees and conservative spread/depth treatment."
    - "Kill market-edge lane if executable KXTEMP prices already reflect the first decision-eligible signal before a realistic order can arrive."
    - "Do not use external t+5 final-estimate accuracy as evidence for first-early-estimate accuracy or tradable headroom."
    - "Kill any event whose rule/source/version was not captured point-in-time."
    - "Do not rescue a failed lane by post-hoc feature/threshold selection; material changes create a new experiment version."
    - "Do not use the Chicago adjacent-hour source cutover as same-hour cross-source arbitrage evidence."
    - "Do not claim novelty for broad early-KWI reconstruction; re-check public competition before any promotion."

  execution_blockers:
    - rule_source_conflict_until_direct_capture
    - strategy_build_not_warranted
    - index_history_may_be_limited
    - receipt_basis_and_backfill_eligibility
    - close_time_relative_to_observation
    - continuous_websocket_sequence_pending
    - external_competition_repricing_speed_unknown
    - first_signal_to_order_latency_unmeasured
    - l2_depth
    - fees
    - latency

  related:
    - KAL-WX-PB001
    - KAL-WX-SRC-001
    - KAL-TWC-001
    - KAL-TWC-002
    - KAL-WX-001
    - KALSHI_WEATHER_SOURCE_MIGRATION_MISPRICING_HYPOTHESIS_2026-09-19
    - knowledge/kalshi/KALSHI_KWI_EXTERNAL_CORROBORATION_2026-09-21.md
