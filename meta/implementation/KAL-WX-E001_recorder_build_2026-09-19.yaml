schema_version: 1
as_of: 2026-09-19
candidate: KAL-WX-INDEX-001
experiment: KAL-WX-E001
economic_status: NO_PROVEN_EDGE
implementation_status: IMPLEMENTED_LIVE_CAPTURE_PENDING
source_repo:
  repo: bas1231/proof-hunter
  branch: ai/weather-index-e001-recorder-v0
  head: 11ce9d1277160ab1b7c65b2748a6b6282cf28ad7
  base_branch: ai/phase15-mecnet-discovery-watch-v0
  base_sha: 9dc7dff86485f2764efbb3e4c294f7a7ba264819
components:
  - name: weather_index_adapter
    path: proof_hunter/venues/kalshi_weather.py
    role: "Read-only raw Weather Index and calibration endpoint capture."
  - name: rules_capture
    path: proof_hunter/source_lock/weather_rules_capture.py
    role: "Raw-first KXTEMP series/event/market rules provenance."
  - name: fee_provenance
    paths:
      - proof_hunter/venues/kalshi_fees.py
      - proof_hunter/source_lock/weather_fee_capture.py
    role: "Series fee history and event fee override history."
  - name: l2_capture
    path: proof_hunter/source_lock/weather_l2_capture.py
    role: "Authenticated GET-only batched KXTEMP orderbooks after public market discovery."
  - name: trade_tape
    paths:
      - proof_hunter/venues/kalshi_trades.py
      - proof_hunter/source_lock/weather_trade_capture.py
    role: "Overlapping public KXTEMP trade windows; downstream replay must deduplicate by venue trade ID."
  - name: orchestrator
    path: proof_hunter/source_lock/weather_index_watch.py
    role: "Shared cycle_id across rules/fees/index/calibration/L2/trades; append-only raw evidence."
  - name: capture_integrity_validator
    path: proof_hunter/source_lock/weather_capture_validate.py
    entrypoint: proof-hunter-weather-validate
    role: "Fail-closed check for missing evidence classes, error events, non-2xx raw metadata, missing bodies and SHA-256 mismatch. Technical gate only."
  - name: cli
    path: pyproject.toml
    entrypoints:
      - proof-hunter-weather-watch
      - proof-hunter-weather-validate
capture_policy:
  default_poll_seconds: 60
  weather_index_overlap_seconds: 900
  trade_overlap_seconds: 900
  rules_and_fees_every_polls: 15
  calibrations_every_polls: 60
  orderbooks: "every poll, authenticated batched read"
  raw_storage: "append-only filesystem archive with exact response bytes, local retrieval timestamp and SHA-256"
  event_log: "append-only JSONL with fsync and shared cycle_id"
authentication:
  orderbooks: REQUIRED
  mode: GET_ONLY
  environment_variables:
    - KALSHI_API_KEY_ID
    - KALSHI_PRIVATE_KEY_PATH
  note: "No credentials are stored in this public/canonical knowledge record."
three_angle_alignment:
  angle_1_rules_semantics:
    implementation: PRESENT
    live_evidence: PENDING
  angle_2_signal_edge:
    implementation: NOT_STARTED
    blocker: "Requires sufficient immutable point-in-time corpus and semantic gate."
  angle_3_market_execution_edge:
    rest_evidence_capture: PRESENT
    continuous_orderbook_timing: REQUIRED_BEFORE_TEST
    analysis: BLOCKED
    blocker: "Minute REST snapshots are sufficient for smoke/corpus bootstrap but insufficient alone for a repricing-lag claim. Continuous authenticated WebSocket orderbook_delta plus trade timestamps are required before Angle 3."
  independent_red_team:
    status: READY
    task: TASK-WX-006
verification:
  github_actions:
    status: UNAVAILABLE_AS_TEST_EVIDENCE
    evidence: "Repository currently has zero successful Actions runs; jobs terminate with no executed steps. Base branch exhibits same behavior."
    nonclaim: "Actions failure is not treated as a code-test failure or a pass."
  local_pytest:
    status: PENDING_STRIX_OR_KALI
  live_read_only_smoke:
    status: PENDING_STRIX_OR_KALI
  live_raw_integrity_check:
    status: IMPLEMENTED_PENDING_LIVE_RUN
primary_docs_crosscheck:
  weather_index: "Current Kalshi docs describe Weather Index as the canonical minute-resolution series behind hourly temperature markets."
  websocket_orderbook: "Authenticated orderbook_delta sends an initial orderbook_snapshot followed by incremental deltas with sid/seq and exchange ts/ts_ms."
  websocket_trades: "Authenticated WebSocket session can stream public trade notifications immediately after execution with sid/seq and ts/ts_ms."
  rate_limits: "Predictions Basic Read budget is currently documented as 200 tokens/s; endpoint costs are dynamic and GET /account/endpoint_costs is authoritative for non-default costs."
important_corrections:
  - "Current orderbook capture must use authenticated read access; older public-client orderbook assumption is not trusted."
  - "Current KXTEMP settlement/source semantics remain event/rule-version gated; no global TWC or Synoptic assumption is promoted."
  - "Calibration published_at/effective_at and Weather Index receipt_basis must remain point-in-time features, never backfilled into earlier decisions."
  - "REST snapshots alone cannot establish second-level market repricing lag; continuous WebSocket evidence is required for Angle 3."
next_gate:
  - "Checkout branch on Strix/Kali."
  - "Install project with dev+auth dependencies and run full pytest."
  - "Run one read-only capture cycle for the four preregistered KXTEMP series."
  - "Run proof-hunter-weather-validate and require PASS_TECHNICAL_CAPTURE_INTEGRITY without changing tests/data."
  - "Inspect direct series/event/market rules and classify current settlement source per event."
  - "Only then start prospective corpus collection and build/validate continuous WebSocket execution evidence before Angle 3."
